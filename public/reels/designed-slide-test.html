<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gary Budgets — Designed Reel Test</title>
<style>
  body { margin: 0; background: #0a0a0f; color: #e8e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 18px; }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .sub { font-size: 12px; color: #8a8a9a; margin: 0; }
  video { width: min(400px, 88vw); aspect-ratio: 9/16; border-radius: 14px; background: #000; box-shadow: 0 0 60px rgba(218,32,42,0.15); }
  button { background: rgba(218,32,42,0.14); border: 1px solid rgba(218,32,42,0.35); color: #ff5a63; font-size: 13px; font-weight: 600; padding: 9px 22px; border-radius: 999px; cursor: pointer; }
  button:hover { background: rgba(218,32,42,0.22); }
</style>
</head>
<body>
  <h1>Gary Budgets — designed-slide reel test</h1>
  <p class="sub">Hook + “Trucks on the clock” · AI-designed frames, subtle motion</p>
  <video id="v" autoplay muted loop playsinline controls preload="auto"
    poster="/reels/designed-test/01-hook.jpg"
    src="/reels/designed-slide-test.mp4"></video>
  <button id="unmute">🔇 Tap for sound</button>
  <script>
    const v = document.getElementById('v');
    const b = document.getElementById('unmute');
    v.play().catch(() => {});
    b.addEventListener('click', () => {
      v.muted = false;
      v.play();
      b.textContent = '🔊 Sound on';
      b.style.opacity = 0.55;
    });
  </script>
</body>
</html>
